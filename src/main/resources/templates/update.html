
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Employee | Employee Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .form-card {
            width: 100%;
            max-width: 520px;
            padding: 35px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: #dbeafe;
            font-size: 32px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 9px;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .update-btn {
            background: #2563eb;
            color: #ffffff;
        }

        .update-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .back-btn {
            margin-top: 12px;
            background: #f1f5f9;
            color: #334155;
        }

        .back-btn:hover {
            background: #e2e8f0;
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="form-card">

    <div class="header">
        <div class="icon">✏️</div>
        <h1>Update Employee</h1>
        <p class="subtitle">Modify the employee details below</p>
    </div>

    <form th:action="@{/update}" th:object="${employee}" method="post">

        <input type="hidden" th:field="*{empNo}">

        <div class="form-group">
            <label for="ename">Employee Name</label>
            <input type="text" id="ename" th:field="*{ename}"
                   placeholder="Enter employee name" required>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" th:field="*{department}"
                   placeholder="Enter department" required>
        </div>

        <div class="form-group">
            <label for="sal">Salary (₹)</label>
            <input type="number" id="sal" th:field="*{sal}"
                   placeholder="Enter salary" min="0" step="0.01" required>
        </div>

        <button type="submit" class="btn update-btn">
            Save Changes
        </button>

        <a th:href="@{/read}" class="btn back-btn">
            ← Back to Employees
        </a>

    </form>

</div>

</body>
</html>
