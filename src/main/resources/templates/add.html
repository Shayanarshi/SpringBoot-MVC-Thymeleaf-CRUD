
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee | Employee Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: #1e293b;
        }

        .form-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: #dcfce7;
            font-size: 30px;
        }

        h2 {
            color: #0f172a;
            margin-bottom: 10px;
            font-size: 27px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            background: #15803d;
            color: #ffffff;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .save-btn:hover {
            background: #166534;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .form-card {
                padding: 26px 20px;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="form-card">

    <div class="header">
        <div class="icon">👤</div>
        <h2>Add Employee</h2>
        <p class="subtitle">
            Enter employee details below to create a new record.
        </p>
    </div>

    <form th:action="@{/save}" th:object="${employee}" method="post">

        <div class="form-group">
            <label for="ename">Employee Name</label>
            <input type="text" id="ename" th:field="*{ename}"
                   placeholder="Enter employee name" required>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" th:field="*{department}"
                   placeholder="e.g. IT, HR, Finance" required>
        </div>

        <div class="form-group">
            <label for="sal">Salary (₹)</label>
            <input type="number" id="sal" th:field="*{sal}"
                   placeholder="Enter salary" min="0"
                   step="0.01" required>
        </div>

        <button type="submit" class="save-btn">
            ＋ Save Employee
        </button>

    </form>

    <a class="back-link" th:href="@{/}">
        ← Back to Home
    </a>

</div>

</body>
</html>
