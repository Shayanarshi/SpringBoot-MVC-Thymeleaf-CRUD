
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details | Employee Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.10);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .header-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dbeafe;
            border-radius: 14px;
            font-size: 28px;
        }

        h1 {
            font-size: 27px;
            color: #0f172a;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: #f1f5f9;
        }

        th {
            padding: 16px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #475569;
            white-space: nowrap;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .emp-id {
            font-weight: 600;
            color: #4f46e5;
        }

        .salary {
            font-weight: 600;
            color: #15803d;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            display: inline-block;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .edit-btn:hover {
            background: #bfdbfe;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty-state {
            text-align: center;
            padding: 45px 20px;
            margin-top: 15px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
        }

        .empty-icon {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #334155;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .add-btn {
            display: inline-block;
            background: #15803d;
            color: #ffffff;
            padding: 11px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .add-btn:hover {
            background: #166534;
        }

        .footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background: #1d4ed8;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #1e40af;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 22px 15px;
            }

            h1 {
                font-size: 22px;
            }

            th, td {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="header-icon">👥</div>
        <div>
            <h1>Employee Details</h1>
            <p class="subtitle">View and manage employee records</p>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(employees)}" class="empty-state">
        <div class="empty-icon">📋</div>
        <h3>No Employees Found</h3>
        <p>There are no employee records yet. Add your first employee to get started.</p>
        <a th:href="@{/add}" class="add-btn">+ Add Employee</a>
    </div>

    <div class="table-wrapper"
         th:unless="${#lists.isEmpty(employees)}">

        <table>
            <thead>
            <tr>
                <th>Employee No</th>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="employee : ${employees}">
                <td class="emp-id" th:text="${employee.empNo}"></td>
                <td th:text="${employee.ename}"></td>
                <td th:text="${employee.department}"></td>
                <td class="salary"
                    th:text="${#numbers.formatDecimal(employee.sal, 1, 2)}"></td>
                <td>
                    <div class="actions">
                        <a class="action-btn edit-btn"
                           th:href="@{/edit/{id}(id=${employee.empNo})}">
                            Edit
                        </a>

                        <a class="action-btn delete-btn"
                           th:href="@{/delete/{id}(id=${employee.empNo})}"
                           onclick="return confirm('Are you sure you want to delete this employee?');">
                            Delete
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

    </div>

    <div class="footer">
        <a class="back-btn" th:href="@{/}">← Back to Home</a>
    </div>

</div>

</body>
</html>
